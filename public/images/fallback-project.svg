<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract system architecture</title>
  <desc id="desc">Five connected colored nodes on a dark technical grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10182d"/>
      <stop offset="1" stop-color="#222044"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8293c4" stroke-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" rx="48" fill="url(#bg)"/>
  <rect width="1200" height="900" rx="48" fill="url(#grid)"/>
  <g fill="none" stroke="#b8c6ef" stroke-width="5" stroke-opacity=".5">
    <path d="M230 450H470M730 450H970M600 320V180M600 580V720M500 380 335 255M700 380 865 255"/>
  </g>
  <g stroke="#eef3ff" stroke-width="8">
    <circle cx="600" cy="450" r="128" fill="#536adf"/>
    <circle cx="230" cy="450" r="72" fill="#7865dd"/>
    <circle cx="970" cy="450" r="72" fill="#2787c8"/>
    <circle cx="600" cy="150" r="72" fill="#2f9c77"/>
    <circle cx="600" cy="750" r="72" fill="#d38a2e"/>
    <circle cx="885" cy="240" r="60" fill="#c85191"/>
    <circle cx="315" cy="240" r="60" fill="#7865dd"/>
  </g>
</svg>
